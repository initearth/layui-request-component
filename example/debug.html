<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>layui request 调试台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.13.9/dist/css/layui.css">
  <link rel="stylesheet" href="./theme/debug.css">
  <script src="./theme/config.js"></script>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">LR</div>
      <div>
        <h1>layui request 调试台</h1>
        <p>登录并鉴权，验证 Token 注入</p>
      </div>
    </div>
    <span class="pill">Debug On</span>
  </header>

  <section class="panel">
    <div class="panel-header">
      <div class="panel-title">
        <span class="panel-index">01</span>
        Token 调试
      </div>
    </div>
    <div class="panel-body">
      <label class="field-label" for="token">Token <span class="field-hint">来自 layui.data，只读</span></label>
      <div class="input-row">
        <input type="text" id="token" class="layui-input" placeholder="登录后自动显示" readonly>
        <button type="button" class="layui-btn layui-btn-normal" id="btn-login">登录</button>
        <button type="button" class="layui-btn btn-secondary" id="btn-invalid-token">设置错误 Token</button>
        <button type="button" class="layui-btn btn-danger" id="btn-clear-token">清除</button>
      </div>
      <div class="input-row auth-actions">
        <button type="button" class="layui-btn btn-secondary" id="btn-auth">请求鉴权</button>
        <button type="button" class="layui-btn btn-secondary" id="btn-auth-401">401 自动拦截</button>
        <button type="button" class="layui-btn btn-danger" id="btn-auth-403">403 拦截</button>
      </div>
    </div>
  </section>

  <div class="result-grid">
    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="panel-index">02</span>
          响应结果
        </div>
        <span id="status" class="status-pill" data-state="idle">状态 -</span>
      </div>
      <div class="panel-body">
        <pre class="code-box" id="response">尚未发送请求</pre>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="panel-index">03</span>
          调试日志
        </div>
      </div>
      <div class="panel-body">
        <div class="code-box" id="console"></div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.13.9/dist/layui.js"></script>
<script src="../dist/request.js"></script>
<script src="./theme/layui.js"></script>
<script src="./theme/debug.js"></script>
</body>
</html>
